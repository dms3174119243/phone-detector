<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>贴膜助手 | 扫码即知手机型号</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(145deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: rgba(255,255,255,0.96);
            border-radius: 2rem;
            padding: 2rem 1.5rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            backdrop-filter: blur(2px);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            color: #1e293b;
        }
        .sub {
            color: #475569;
            font-size: 0.85rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 1rem;
        }
        .result-box {
            background: #f8fafc;
            border-radius: 1.5rem;
            padding: 1.8rem 1rem;
            margin: 1.5rem 0;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .brand-icon {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }
        .model-name {
            font-size: 1.35rem;
            font-weight: 600;
            color: #0f172a;
            background: white;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            display: inline-block;
            margin: 0.5rem 0;
        }
        .tip {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 1rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 1rem;
        }
        .manual-select {
            margin-top: 1rem;
            text-align: left;
        }
        .brand-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 0.8rem;
        }
        .brand-btn {
            background: #eef2ff;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #4f46e5;
            cursor: pointer;
            transition: 0.2s;
        }
        .brand-btn:active {
            background: #c7d2fe;
            transform: scale(0.96);
        }
        .loading-spinner {
            width: 2rem;
            height: 2rem;
            border: 3px solid #e2e8f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 0.8rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-text {
            font-size: 0.9rem;
            color: #334155;
        }
        button {
            background: none;
            border: none;
        }
    </style>
    <!-- 加载本地UA解析库 (完全离线可用) -->
    <script src="https://cdn.jsdelivr.net/npm/ua-parser-js@1.0.38/dist/ua-parser.min.js"></script>
</head>
<body>
<div class="card" id="app">
    <h1>📱 贴膜助手</h1>
    <div class="sub">扫码即知手机型号，精准匹配贴膜</div>

    <div class="result-box" id="resultArea">
        <div class="loading-spinner"></div>
        <div class="status-text">正在识别您的手机...</div>
    </div>

    <div class="tip">
        ＊ 识别结果仅供参考，请告知店员型号即可
    </div>
    <div id="manualPanel" style="margin-top: 1rem;"></div>
</div>

<script>
    (function() {
        // DOM 元素
        const resultArea = document.getElementById('resultArea');
        const manualPanel = document.getElementById('manualPanel');
        
        // 通用识别函数 (基于UA)
        function getDeviceInfo() {
            const parser = new UAParser();
            const result = parser.getResult();
            const ua = navigator.userAgent;
            
            let brand = '';
            let model = '';
            let fullName = '';
            
            // 优先使用 ua-parser-js 的结果
            if (result.device && result.device.vendor && result.device.model) {
                brand = result.device.vendor;
                model = result.device.model;
                fullName = `${brand} ${model}`;
            }
            
            // 针对常见品牌的深度识别 (弥补 ua-parser 某些型号缺失)
            // iPhone 系列
            if (/iPhone/i.test(ua)) {
                brand = 'Apple';
                const match = ua.match(/iPhone(?:;\s*CPU\s*(?:iPhone\s*(?:Pro\s*)?(?:Max)?)?\s*OS\s*(\d+_\d+))?/i);
                if (ua.includes('iPhone15,2')) model = 'iPhone 14 Pro';
                else if (ua.includes('iPhone15,3')) model = 'iPhone 14 Pro Max';
                else if (ua.includes('iPhone14,2')) model = 'iPhone 13 Pro';
                else if (ua.includes('iPhone14,3')) model = 'iPhone 13 Pro Max';
                else if (ua.includes('iPhone14,5')) model = 'iPhone 13';
                else if (ua.includes('iPhone13,2')) model = 'iPhone 12';
                else if (ua.includes('iPhone12,1')) model = 'iPhone 11';
                else model = 'iPhone';
                fullName = `${brand} ${model}`;
            }
            // 华为 / 荣耀 特殊型号
            else if (/HUAWEI|HUAWEI/i.test(ua) || /VOG-AL00|TAS-AL00|LIO-AL00|NOH-AN00/i.test(ua)) {
                brand = '华为';
                if (/VOG-AL00/i.test(ua)) model = 'P30 Pro';
                else if (/TAS-AL00/i.test(ua)) model = 'Mate 30';
                else if (/LIO-AL00/i.test(ua)) model = 'Mate 30 Pro';
                else if (/NOH-AN00/i.test(ua)) model = 'P40 Pro';
                else model = '华为手机';
                fullName = `${brand} ${model}`;
            }
            // 小米 / 红米 / POCO
            else if (/Mi\s|Redmi|POCO/i.test(ua)) {
                brand = '小米/红米';
                const miMatch = ua.match(/Mi\s(\w+)/i);
                if (miMatch) model = miMatch[1];
                else model = '小米手机';
                fullName = `${brand} ${model}`;
            }
            // OPPO / OnePlus / realme
            else if (/OPPO|OnePlus|realme/i.test(ua)) {
                if (/OPPO/i.test(ua)) brand = 'OPPO';
                else if (/OnePlus/i.test(ua)) brand = '一加';
                else brand = 'realme';
                const match = ua.match(/(?:OPPO|OnePlus|realme)\s+(\w+)/i);
                if (match) model = match[1];
                else model = `${brand}手机`;
                fullName = `${brand} ${model}`;
            }
            // vivo / iQOO
            else if (/vivo|iQOO/i.test(ua)) {
                brand = /vivo/i.test(ua) ? 'vivo' : 'iQOO';
                const match = ua.match(/(?:vivo|iQOO)\s+(\w+)/i);
                if (match) model = match[1];
                else model = `${brand}手机`;
                fullName = `${brand} ${model}`;
            }
            // 三星
            else if (/Samsung|SM-|Galaxy/i.test(ua)) {
                brand = '三星';
                const match = ua.match(/SM-([A-Za-z0-9]+)/i);
                if (match) model = `Galaxy ${match[1]}`;
                else model = '三星手机';
                fullName = `${brand} ${model}`;
            }
            
            // 如果上面都没抓到，就用 ua-parser 的结果，或者粗暴显示 Android/iOS
            if (!fullName || fullName === 'undefined undefined') {
                if (/Android/i.test(ua)) {
                    brand = '安卓手机';
                    model = '未知型号';
                    fullName = '安卓手机 (请见下方常见品牌)';
                } else if (/iPhone|iPad|iPod/i.test(ua)) {
                    brand = 'Apple';
                    model = /iPad/i.test(ua) ? 'iPad' : 'iPhone';
                    fullName = `${brand} ${model}`;
                } else {
                    brand = '未知品牌';
                    model = '';
                    fullName = '未能自动识别';
                }
            }
            
            return { brand, model, fullName, rawUA: ua };
        }
        
        // 渲染成功界面
        function renderSuccess(device) {
            resultArea.innerHTML = `
                <div class="brand-icon">📱</div>
                <div class="model-name">${escapeHtml(device.fullName)}</div>
                <div style="font-size: 0.75rem; color: #475569; margin-top: 0.5rem;">
                    设备类型: ${/iPad|iPhone/i.test(device.rawUA) ? 'iOS设备' : '安卓设备'}
                </div>
                <div style="font-size: 0.7rem; color: #94a3b8; margin-top: 0.8rem;">
                    👆 请截图此页，告知店员型号
                </div>
            `;
            manualPanel.innerHTML = ''; // 无需手动选择
        }
        
        function renderFallback() {
            // 识别失败时，提供常见品牌手动选择
            resultArea.innerHTML = `
                <div class="brand-icon">⚠️</div>
                <div style="font-size: 1.1rem; font-weight: 500; margin: 0.5rem 0;">未能自动识别</div>
                <div style="font-size: 0.8rem; color: #475569;">请点击下方品牌手动选择</div>
            `;
            manualPanel.innerHTML = `
                <div class="manual-select">
                    <div style="font-size: 0.75rem; color: #475569; margin-bottom: 0.3rem;">👇 常见品牌</div>
                    <div class="brand-buttons" id="brandButtons">
                        <button class="brand-btn" data-brand="Apple iPhone">🍎 iPhone</button>
                        <button class="brand-btn" data-brand="华为">📱 华为</button>
                        <button class="brand-btn" data-brand="小米/红米">📲 小米/红米</button>
                        <button class="brand-btn" data-brand="OPPO">📱 OPPO</button>
                        <button class="brand-btn" data-brand="vivo">📱 vivo</button>
                        <button class="brand-btn" data-brand="荣耀">✨ 荣耀</button>
                        <button class="brand-btn" data-brand="三星">⭐ 三星</button>
                        <button class="brand-btn" data-brand="一加">⚡ 一加</button>
                        <button class="brand-btn" data-brand="realme">🎮 realme</button>
                    </div>
                </div>
            `;
            // 绑定按钮事件
            document.querySelectorAll('.brand-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const brand = btn.getAttribute('data-brand');
                    resultArea.innerHTML = `
                        <div class="brand-icon">✅</div>
                        <div class="model-name">${escapeHtml(brand)}</div>
                        <div style="font-size: 0.7rem; color: #94a3b8; margin-top: 0.8rem;">
                            👆 请截图告知店员
                        </div>
                    `;
                    manualPanel.innerHTML = ''; // 清除选择区
                });
            });
        }
        
        // 简单的防XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }
        
        // 主流程
        try {
            const device = getDeviceInfo();
            // 如果识别结果太模糊 (例如 "未知品牌 未知型号" 或 "安卓手机 未知型号")
            const isTooVague = device.fullName.includes('未知') || device.fullName === '安卓手机 (请见下方常见品牌)' || device.fullName === '未能自动识别';
            if (!isTooVague && device.fullName && device.fullName.length > 2) {
                renderSuccess(device);
            } else {
                renderFallback();
            }
        } catch (err) {
            console.error(err);
            renderFallback();
        }
    })();
</script>
</body>
</html>
